<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- 敌人-中：紫色飞行体，扁平矢量，俯视，透明背景，中心原点 -->
  <g transform="translate(128,128)">
    <!-- 拖尾（半透明紫） -->
    <path d="M40,40 C80,80 80,80 110,110 C70,70 40,40 40,40 Z" fill="#8E44AD" opacity="0.35"/>
    <path d="M-40,40 C-80,80 -80,80 -110,110 C-70,70 -40,40 -40,40 Z" fill="#8E44AD" opacity="0.35"/>
    <!-- 飞行体主体（菱形） -->
    <path d="M0,-60 C30,-20 30,20 0,60 C-30,20 -30,-20 0,-60 Z" fill="#8E44AD"/>
    <!-- 发光核心 -->
    <ellipse cx="0" cy="0" rx="18" ry="34" fill="#C39BD3"/>
    <!-- 单眼（辨识） -->
    <circle cx="0" cy="-6" r="12" fill="#FFFFFF"/>
    <circle cx="0" cy="-4" r="6" fill="#4A235A"/>
    <!-- 翼尖 -->
    <path d="M0,-60 L14,-30 L-14,-30 Z" fill="#6C3483"/>
  </g>
</svg>
