<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- 玩家：橙黄斗篷幸存者，扁平矢量，俯视，透明背景，中心原点 -->
  <g transform="translate(128,128)">
    <!-- 斗篷外轮廓（深橙） -->
    <path d="M0,-70 C40,-60 55,-10 45,55 C30,75 -30,75 -45,55 C-55,-10 -40,-60 0,-70 Z" fill="#E8941C"/>
    <!-- 斗篷内（亮橙） -->
    <path d="M0,-58 C32,-50 44,-8 36,48 C24,64 -24,64 -36,48 C-44,-8 -32,-50 0,-58 Z" fill="#FFB347"/>
    <!-- 头部（高光） -->
    <circle cx="0" cy="-30" r="22" fill="#FFE0A3"/>
    <!-- 兜帽阴影 -->
    <path d="M-22,-34 C-22,-52 22,-52 22,-34 C12,-44 -12,-44 -22,-34 Z" fill="#E8941C"/>
    <!-- 双眼（深色，辨识朝向） -->
    <circle cx="-8" cy="-30" r="4" fill="#3A2A12"/>
    <circle cx="8" cy="-30" r="4" fill="#3A2A12"/>
    <!-- 中央高光符号 -->
    <path d="M0,-12 L10,8 L-10,8 Z" fill="#FFE0A3"/>
  </g>
</svg>
